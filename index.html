<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text to Video App</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }
        .box {
            background: #1e293b;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
            max-width: 520px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            color: #38bdf8;
            margin: 0 0 8px 0;
        }
        .hint {
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 12px;
            text-align: left;
            line-height: 1.5;
        }
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #ffffff;
            border-radius: 10px;
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 12px;
        }
        .options {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 14px;
            font-size: 13px;
            color: #e2e8f0;
        }
        .options label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #1d4ed8;
        }
        button:disabled {
            background: #64748b;
            cursor: not-allowed;
        }
        #status {
            margin-top: 14px;
            font-size: 14px;
            color: #fbbf24;
            min-height: 20px;
        }
        canvas, video {
            width: 100%;
            margin-top: 16px;
            border-radius: 12px;
            background: #000000;
            display: block;
        }
        .download-link {
            display: inline-block;
            margin-top: 12px;
            width: 100%;
            padding: 11px;
            background: #10b981;
            color: #ffffff;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            box-sizing: border-box;
        }
        .download-link:hover {
            background: #059669;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>AI Text to Video</h1>
        <div class="hint">প্রতি লাইনে একটি করে দৃশ্য লিখুন (প্রতি দৃশ্য ৩.৫ সেকেন্ডের ভিডিও হবে):</div>
        <textarea id="promptInput" rows="4" placeholder="উদাহরণ:&#10;Golden sunset over the calm ocean&#10;Soft waves glowing under twilight sky&#10;Peaceful night stars above the sea"></textarea>

        <div class="options">
            <label><input type="checkbox" id="voiceToggle" checked> ভয়েস ক্যাপশন (Voice)</label>
            <label><input type="checkbox" id="musicToggle" checked> ব্যাকগ্রাউন্ড সাউন্ড (Music)</label>
        </div>

        <button id="generateBtn">সাউন্ড ও ক্যাপশনসহ ভিডিও তৈরি করুন</button>
        <div id="status"></div>
        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
