<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text to Video App</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }
        .box {
            background: #1e293b;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            color: #38bdf8;
            margin: 0 0 8px 0;
        }
        .hint {
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 12px;
            text-align: left;
            line-height: 1.5;
        }
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #ffffff;
            border-radius: 10px;
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 12px;
        }
        .options {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 14px;
            font-size: 13px;
            color: #e2e8f0;
        }
        .options label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #1d4ed8;
        }
        button:disabled {
            background: #64748b;
            cursor: not-allowed;
        }
        #status {
            margin-top: 12px;
            font-size: 14px;
            color: #fbbf24;
            min-height: 20px;
        }
        .video-stage {
            position: relative;
            overflow: hidden;
            margin-top: 14px;
            border-radius: 12px;
            background: #000000;
            aspect-ratio: 16 / 9;
        }
        .video-stage img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            animation: slowMotion 5s ease-in-out infinite alternate;
            animation-play-state: running;
        }
        .video-stage.paused img {
            animation-play-state: paused;
        }
        .top-bar {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }
        .badge {
            background: rgba(15, 23, 42, 0.8);
            color: #ffffff;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 999px;
        }
        .caption-box {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 12px 16px;
            background: linear-gradient(transparent, rgba(15, 23, 42, 0.9));
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            word-break: break-word;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }
        .ctrl-btn {
            background: #334155;
            font-size: 14px;
            padding: 10px;
        }
        .ctrl-btn:hover {
            background: #475569;
        }
        @keyframes slowMotion {
            0% {
                transform: scale(1) translate(0, 0);
            }
            100% {
                transform: scale(1.15) translate(-2%, -2%);
            }
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>AI Text to Video</h1>
        <div class="hint">প্রতি লাইনে একটি করে দৃশ্য লিখুন:</div>
        <textarea id="promptInput" rows="4" placeholder="sunset over sea&#10;golden waves on beach&#10;night stars above ocean"></textarea>

        <div class="options">
            <label><input type="checkbox" id="voiceCheck" checked> ক্যাপশন ভয়েস</label>
            <label><input type="checkbox" id="soundCheck" checked> ব্যাকগ্রাউন্ড সাউন্ড</label>
        </div>

        <button id="generateBtn">ভিডিও তৈরি করুন</button>
        <div id="status"></div>
        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
