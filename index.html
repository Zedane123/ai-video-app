<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text to Video App</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }
        .box {
            background: #ffffff;
            padding: 28px;
            border-radius: 14px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            color: #0f172a;
            margin-bottom: 10px;
        }
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #1d4ed8;
        }
        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }
        #status {
            margin-top: 14px;
            font-size: 14px;
            color: #475569;
        }
        .scene-frame {
            position: relative;
            overflow: hidden;
            margin-top: 16px;
            border-radius: 10px;
            background: #0f172a;
        }
        .scene-frame img {
            width: 100%;
            display: block;
            animation: slowZoom 10s ease-in-out infinite alternate;
            animation-play-state: running;
        }
        .scene-frame.paused img {
            animation-play-state: paused;
        }
        .scene-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 10px 14px;
            background: rgba(15, 23, 42, 0.75);
            color: #ffffff;
            font-size: 14px;
            text-align: left;
            word-break: break-word;
        }
        .controls {
            margin-top: 12px;
            display: flex;
            gap: 10px;
        }
        .secondary-btn {
            background: #334155;
            font-size: 14px;
            padding: 10px;
        }
        .secondary-btn:hover {
            background: #1e293b;
        }
        @keyframes slowZoom {
            0% {
                transform: scale(1) translate(0, 0);
            }
            100% {
                transform: scale(1.12) translate(-2%, -2%);
            }
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>AI Text to Video</h1>
        <textarea id="promptInput" rows="4" placeholder="আপনি কী ধরনের দৃশ্য বা ভিডিও চান তা লিখুন..."></textarea>
        <button id="generateBtn">ভিডিও তৈরি করুন</button>
        <div id="status"></div>
        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
